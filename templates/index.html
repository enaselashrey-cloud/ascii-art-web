{{define "content"}}
<div class="main-box">

  <!-- input box -->
  <div class="input-box">
    <textarea name="text" placeholder="Enter your text..."></textarea>
  </div>

  <!-- options -->
 <div class="options">

  <!-- FONT -->
  <div class="select-box">
    <span>Font:</span>
    <select name="font">
      <option>Standard</option>
      <option>Shadow</option>
      <option>Thinkertoy</option>
    </select>
  </div>

  <!-- COLOR -->
  <div class="color-box">
    <span>Color:</span>
    <input type="color" name="color">
  </div>

</div>
  <!-- button -->
  <button type="submit">Generate</button>

  <!-- output -->
  <div class="output-box">
    <pre>{{.Result}}</pre>
  </div>

</div>
{{end}}
