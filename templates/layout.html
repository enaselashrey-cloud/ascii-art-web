{{define "layout"}}
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>ASCII Art</title>
  <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

  <div class="navbar">
    <div>
      <a href="/" class="logo">ASCII</a>
    </div>

    <div>
      <a href="/history" class="nav-item">History</a>
      <a href="/about" class="nav-item">About</a>
      <a href="/contact" class="nav-item">Contact us</a>
    </div>
  </div>

  <div class="main-layout">

    <div class="content">
      {{template "content" .}}
    </div>

    <div class="puzzle">

      <div class="text">
        <h5>
          LIFE <br>
          IS <br>
          PUZZLE
        </h5>

        <h1>We solve it..!</h1>
      </div>

      <img src="/static/image.png" class="puzzle-img">

    </div>

  </div>

  <div class="footer">
    <p>© 2026 ASCII Art Project</p>
  </div>

  <script>
    if (window.history.replaceState && window.location.pathname === "/ascii-art") {
      window.history.replaceState(null, "", "/");
    }
  </script>
</body>

</html>
{{end}}
